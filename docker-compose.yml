version: '3.8'

services:
  # 1. PostgreSQL Database (Local container alternative to Neon Serverless PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: bidvelocity-postgres
    environment:
      POSTGRES_USER: bvadmin
      POSTGRES_PASSWORD: trust-local-no-password
      POSTGRES_DB: bidvelocity_auth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bvadmin -d bidvelocity_auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. BidVelocity Core Platform (Multi-Stage Production Image with Nginx + Java 21)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bidvelocity-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=bvadmin
      - DB_PASSWORD=trust-local-no-password
      - JWT_SECRET=dev-only-insecure-gateway-secret-change-me-32
      - FRONTEND_URL=http://localhost:5173
      - DEMO_SEED=true
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
